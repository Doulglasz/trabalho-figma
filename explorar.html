<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyroad — Selecione o destino</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="cabecalho cabecalhoCentralizado">
            <a class="botaoVoltar" href="index.html">‹</a>
            <h1>Selecione o destino</h1>
        </header>
        <main class="scroll">
            <form class="campoBusca" role="search" action="#" onsubmit="return false;">
                <span>🔍︎</span>
                <label for="destino" class="visualmenteOculto">Para onde, Sr. Richard?</label>
                <input type="text" id="destino" name="destino" placeholder="Para onde, Sr. Richard?" autocomplete="off">
            </form>
            <section>
                <div class="headerSection">
                    <h2 id="recentes-heading" class="tituloPequeno">Viagens recentes</h2>
                </div>
                <div class="destinosGrid">
                    <a class="destinoCard" href="aeronaves.html">
                        <span class="destinoCardIcone">
                            <svg width="17" height="17" viewbox="0 0 24 24" fill="none">
                                <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                                <circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"></circle>
                            </svg>
                        </span>
                        <span class="destinoCardCodigo">GVA</span>
                        <span class="destinoCardCidade">São Paulo</span>
                    </a>
                    <a class="destinoCard" href="aeronaves.html">
                        <span class="destinoCardIcone">
                            <svg width="17" height="17" viewbox="0 0 24 24" fill="none">
                                <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                                <circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"></circle>
                            </svg>
                        </span>
                        <span class="destinoCardCodigo">DXB</span>
                        <span class="destinoCardCidade">Rio de Janeiro</span>
                    </a>
                    <a class="destinoCard destinoCardDesativado" href="aeronaves.html">
                        <span class="destinoCardIcone">
                            <svg width="15" height="15" viewbox="0 0 24 24" fill="none">
                                <path d="M3 12a9 9 0 1 1 3.5 7.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                                <path d="M3 8v4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                        <span class="destinoCardCodigo">CDG</span>
                        <span class="destinoCardCidade">Santa Catarina</span>
                    </a>
                </div>
            </section>
        </main>
        <nav class="barraNavegacao">
            <a href="index.html">
                <span class="iconeNavegacao">⌂</span>Início</a>
            <a href="voos.html">
                <span class="iconeNavegacao">✈</span>Voos</a>
            <a href="aeronaves.html" class="selecionado">
                <span class="iconeNavegacao">◉</span>Explorar</a>
        </nav>
    </div>
</body>
</html>
