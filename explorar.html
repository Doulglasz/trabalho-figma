<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroSuite — Selecione o destino</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar topbar--centered">
    <a class="back-btn" href="index.html" aria-label="Voltar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Selecione o destino</h1>
  </header>

  <main class="app__scroll">

    <form class="search-field" role="search" action="#" onsubmit="return false;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <label for="destino" class="visually-hidden" style="position:absolute; left:-9999px;">Para onde, Sr. Richard?</label>
      <input type="text" id="destino" name="destino" placeholder="Para onde, Sr. Richard?" autocomplete="off">
    </form>

    <section aria-labelledby="recentes-heading">
      <div class="section-head">
        <h2 id="recentes-heading" style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary);">Viagens recentes</h2>
      </div>

      <div class="destination-grid">
        <a class="destination-card" href="#">
          <span class="destination-card__icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
          </span>
          <span class="destination-card__code">GVA</span>
          <span class="destination-card__city">São Paulo</span>
        </a>

        <a class="destination-card" href="#">
          <span class="destination-card__icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
          </span>
          <span class="destination-card__code">DXB</span>
          <span class="destination-card__city">Rio de Janeiro</span>
        </a>

        <a class="destination-card destination-card--muted" href="#" aria-disabled="true">
          <span class="destination-card__icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 1 3.5 7.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 8v4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="destination-card__code">CDG</span>
          <span class="destination-card__city">Santa Catarina</span>
        </a>
      </div>
    </section>

  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="index.html">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Início
    </a>
    <a href="voos.html">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M21 16v-2l-8-5V4a1.5 1.5 0 0 0-3 0v5l-8 5v2l8-2.5V19l-2.5 1.5V22l3.5-1 3.5 1v-1.5L12 19v-5.5l9 2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      Voos
    </a>
    <a href="explorar.html" class="is-active">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="m15 9-2 6-6 2 2-6 6-2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      Explorar
    </a>
  </nav>

</div>
</body>
</html>
