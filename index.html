<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyRoad - Aviação Executiva</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="screens-wrapper">
  <div class="phone dark">
    <div class="home-header">
      <div class="user-info">
        <span class="welcome">Bem-vindo</span>
        <h3>Sr. Richard</h3>
      </div>
      <div class="header-icons">
        <span class="icon-circle">&#128100;</span>
        <span class="icon-circle">&#128276;</span>
      </div>
    </div>

    <div class="section-title">
      <span>Próxima viagem</span>
      <a href="#" class="see-details">Ver detalhes &#8250;</a>
    </div>

    <div class="trip-card">
      <div class="trip-route">
        <div class="route-point">
          <strong>CGH</strong>
          <span>São Paulo, BR</span>
        </div>
        <div class="route-line">
          <span class="route-label">DIRETO</span>
        </div>
        <div class="route-point right">
          <strong>LGA</strong>
          <span>Nova York, US</span>
        </div>
      </div>
      <div class="trip-meta">
        <span>07 Set, 2026</span>
        <span>09:00 AM BRT</span>
      </div>
      <div class="trip-meta">
        <span>Gulfstream G650</span>
        <span>4 Pessoas</span>
      </div>
    </div>

    <button class="btn-primary full">Agendar Novo Voo</button>

    <div class="section-title">
      <span>Recomendações</span>
    </div>

    <div class="recommend-row">
      <div class="recommend-card">
        <div class="recommend-img">&#9992;</div>
        <span class="recommend-name">Bombardier Global 7500</span>
      </div>
      <div class="recommend-card">
        <div class="recommend-img">&#9992;</div>
        <span class="recommend-name">Gulfstream G650</span>
      </div>
    </div>

    <nav class="bottom-nav">
      <span class="nav-item active">&#8962;</span>
      <span class="nav-item">&#9992;</span>
      <span class="nav-item">&#9776;</span>
    </nav>
  </div>

</div>

</body>
</html>
