<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyroad - Resumo do voo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app appResumo">
        <header class="cabecalho cabecalhoCentralizado">
            <a class="botaoVoltar" href="calendario.html">‹</a>
            <h1>Resumo</h1>
        </header>
        <main class="scroll telaResumo">
            <section class="resumoRota">
                <div>
                    <strong>DDB</strong>
                    <p>Avenida Paulista,<br>SP</p>
                </div>
                <span class="resumoRotaSeta">⟶</span>
                <div class="resumoRotaDestino">
                    <strong>LJH</strong>
                    <p>Bangu, RJ</p>
                </div>
                <div class="resumoRotaDados">
                    <span>▣  15 Set, 2026</span>
                    <span>◷  14:30 PM</span>
                </div>
            </section>
            <article class="resumoAeronave">
                <img src="assets/catalogo1.png" alt="Aeronave XPX 3000 escolhida para a viagem">
                <div class="resumoAeronaveBody">
                    <div>
                        <h2>XPX 3000</h2>
                        <p>Capacidade: 8 Passageiros</p>
                    </div>
                    <span class="avaliacao">4 <b>★</b>
                    </span>
                </div>
            </article>
            <section class="boxPreco resumoPreco">
                <div class="linhaPreco">
                    <span>Viagem</span>
                    <strong>R$ 4.320,00</strong>
                </div>
                <div class="linhaPreco">
                    <span>Taxas e Impostos</span>
                    <strong>R$ 751,39</strong>
                </div>
                <div class="linhaPreco linhaPrecoTotal">
                    <span id="total-title">Custo Total</span>
                    <strong>R$ 5.071,39</strong>
                </div>
            </section>
            <a class="botao resumoBotao" href="index.html">Agendar</a>
        </main>
        <nav class="barraNavegacao">
            <a href="index.html">
                <span class="iconeNavegacao">⌂</span>Início</a>
            <a href="voos.html">
                <span class="iconeNavegacao">✈</span>Voos</a>
            <a href="aeronaves.html" class="selecionado">
                <span class="iconeNavegacao">◉</span>Explorar</a>
        </nav>
    </div>
</body>
</html>
